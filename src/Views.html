function ringHTML(percent, value, label, size) {
  var pct = clamp(Number(percent) || 0, 0, 100);
  var radius = 52;
  var circumference = 2 * Math.PI * radius;
  var offset = circumference * (1 - pct / 100);
  return '<div class="ring" style="--ring-size:' + (size || 130) + 'px" role="img" aria-label="' + esc(label + ' ' + pct + '%') + '">' +
    '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle class="ring-track" cx="60" cy="60" r="' + radius + '"></circle>' +
      '<circle class="ring-fill" cx="60" cy="60" r="' + radius + '" style="stroke-dasharray:' + circumference.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + '"></circle>' +
    '</svg>' +
    '<div class="ring-content"><div class="ring-value">' + esc(value) + '</div><div class="ring-label">' + esc(label) + '</div></div>' +
  '</div>';
}

function trackIconHTML(track, iconName, extra) {
  return '<span class="track-icon track-' + (track === 'grammar' ? 'grammar' : 'vocabulary') + ' ' + (extra || '') + '">' +
    icon(iconName || (track === 'grammar' ? 'book-open' : 'languages')) + '</span>';
}

function statCardHTML(options) {
  var opts = options || {};
  return '<div class="stat-card ' + (opts.accent ? 'stat-card--accent' : '') + '">' +
    '<div class="stat-card-head">' + icon(opts.icon || 'chart') + ' ' + esc(opts.label || '') + '</div>' +
    '<div class="stat-card-value"><strong>' + esc(opts.value) + '</strong>' + (opts.suffix ? '<span>' + esc(opts.suffix) + '</span>' : '') + '</div>' +
    (opts.foot ? '<div class="stat-card-foot">' + opts.foot + '</div>' : '') +
  '</div>';
}

function missionHTML(options) {
  var opts = options || {};
  var progress = clamp(Number(opts.progress) || 0, 0, opts.target);
  var pct = opts.target ? Math.round((progress / opts.target) * 100) : 0;
  var done = progress >= opts.target;
  return '<div class="mission ' + (done ? 'is-done' : '') + '">' +
    '<span class="mission-check">' + icon('check') + '</span>' +
    '<div class="mission-main"><div class="mission-title">' + esc(opts.title) + '</div>' +
      '<div class="mission-sub">' + esc(opts.sub || (progress + ' / ' + opts.target)) + '</div></div>' +
    '<div class="mission-progress"><div class="progress progress--thin"><span class="progress-fill" style="width:' + pct + '%"></span></div></div>' +
    '<span class="mission-xp">' + (done ? 'Selesai' : progress + '/' + opts.target) + '</span>' +
  '</div>';
}

function achievementCardHTML(a) {
  var pct = a.target ? Math.round((Math.min(a.progress, a.target) / a.target) * 100) : 0;
  var gateNote = a.gate && !a.gateMet
    ? '<span>Butuh ' + a.gate.target + ' ' + (a.gate.metric === 'answers' ? 'jawaban' : a.gate.metric) + ' dulu</span>'
    : '<span>' + a.progress + ' / ' + a.target + '</span>';
  return '<div class="achievement-card ' + (a.unlocked ? 'is-unlocked' : 'is-locked') + '">' +
    '<span class="tier-tag tier-tag--' + esc(a.tier) + '">' + esc(a.tier) + '</span>' +
    '<span class="achievement-icon">' + icon(a.unlocked ? a.icon : 'lock') + '</span>' +

      '<p>' + esc(a.description) + '</p>' +
      '<div class="achievement-progress"><div class="progress progress--thin"><span class="progress-fill" style="width:' + pct + '%"></span></div>' +
      gateNote + '</div>' +
    '</div>' +
  '</div>';
}

function emptyStateHTML(iconName, title, text, action) {

function progressBarHTML(percent, extraClass) {

function initLanding() {
  var nav = document.querySelector('.landing-nav');
  if (nav) nav.classList.toggle('is-scrolled', window.scrollY > 24);

  var stage = document.querySelector('.hero-stage');
  var main = document.querySelector('.stage-main');
  if (stage && main && window.matchMedia && window.matchMedia('(pointer:fine)').matches &&
      !(window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
    stage.addEventListener('pointermove', function (event) {
      var rect = stage.getBoundingClientRect();
      var x = (event.clientX - rect.left) / rect.width - 0.5;
      var y = (event.clientY - rect.top) / rect.height - 0.5;
      main.style.transform = 'rotate(' + (-2.2 + y * 2) + 'deg) rotateY(' + (4 + x * 5) + 'deg) translateY(' + (y * -4) + 'px)';
    });
    stage.addEventListener('pointerleave', function () {
      main.style.transform = '';
    });
  }
}

function renderCatalogGrid(track) {
  var query = normalizeText(DIXI_STATE.catalogFilter.q);
  var level = DIXI_STATE.catalogFilter.level;
  var list = (getCatalog()[track] || []).map(moduleView).filter(function (m) {
    if (level !== 'all' && m.level !== level) return false;
    if (!query) return true;
    return normalizeText(m.title + ' ' + m.subtitle + ' ' + m.description + ' ' + m.level).indexOf(query) !== -1;
  });

  if (!list.length) {
    return '<div style="grid-column:1/-1;">' + emptyStateHTML('search', 'Modul tidak ditemukan', 'Coba kata kunci lain atau ubah filter level.', '<button class="btn btn-ghost btn-sm" data-action="catalog-reset">Reset filter</button>') + '</div>';
  }

  return list.map(moduleCardHTML).join('');
}

function moduleCardHTML(m) {
  var pct = Number(m.bestScore) || 0;
  var locked = !!m.locked;
  var attrs = locked
    ? 'data-action="locked-module" data-title="' + esc(m.title) + '"'
    : 'data-route="#/lesson/' + m.track + '/' + m.id + '"';
  var classes = 'module-card track-' + m.track +
    (locked ? ' is-locked' : '') +
    (m.completed ? ' is-complete' : '');

function lessonSectionHTML(section, index) {
  var parts = '';
  if (section.body && section.body.length) {
    parts += '<div class="lesson-body">' + section.body.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
  }
  if (section.bullets && section.bullets.length) {
    parts += '<ul class="bullet-list">' + section.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
  }
  if (section.formula && section.formula.length) {
    parts += '<div class="formula-card">' + section.formula.map(function (f) {
      return '<div class="formula-row"><span class="formula-label">' + esc(f.label) + '</span><span class="formula-value">' + esc(f.value) + '</span></div>';
    }).join('') + '</div>';
  }
  if (section.table && section.table.headers) {
    parts += '<div class="example-table"><table><thead><tr>' +
      section.table.headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + section.table.rows.map(function (row) {
        return '<tr>' + row.map(function (cell) { return '<td>' + esc(cell) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  if (section.examples && section.examples.length) {
    parts += '<div class="example-list">' + section.examples.map(function (ex) {
      return '<div class="example-card"><div class="example-en">' + esc(ex.en) + '</div><div class="example-id">' + esc(ex.id) + '</div></div>';
    }).join('') + '</div>';
  }
  if (section.tip) {
    parts += '<div class="tip-box"><span class="tip-icon">' + icon('lightbulb') + '</span><p><strong>Tips:</strong> ' + esc(section.tip) + '</p></div>';
  }

  return '<section class="lesson-section" id="lesson-section-' + index + '">' +
    '<div class="lesson-section-head"><span class="section-number">' + (index + 1) + '</span><h2>' + esc(section.title) + '</h2>' + icon(section.icon || 'sparkles') + '</div>' +
    parts +
  '</section>';
}

function vocabCardHTML(v) {
  return '<div class="vocab-card">' +
    '<div class="vocab-top"><span class="vocab-word">' + esc(v.word) + '</span><span class="vocab-pos">' + esc(v.pos) + '</span>' +
      '<button class="speak-btn" data-action="speak" data-word="' + esc(v.word) + '" aria-label="Dengarkan ' + esc(v.word) + '">' + icon('volume') + '</button></div>' +
    '<div class="vocab-phonetic">' + esc(v.phonetic) + '</div>' +
    '<div class="vocab-meaning">' + esc(v.meaning) + '</div>' +
    '<div class="vocab-example">“' + esc(v.example) + '”</div>' +
  '</div>';
}

function initLesson() {
  if (DIXI_STATE.lessonObserver) {
    try { DIXI_STATE.lessonObserver.disconnect(); } catch (err) { /* abaikan */ }
  }
  var links = Array.prototype.slice.call(document.querySelectorAll('.outline-link'));
  var sections = Array.prototype.slice.call(document.querySelectorAll('.lesson-section'));
  if (!links.length || !sections.length || !('IntersectionObserver' in window)) return;

  DIXI_STATE.lessonObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      var id = '#' + entry.target.id;
      links.forEach(function (link) {
        link.classList.toggle('is-active', link.getAttribute('data-target') === id);
      });
    });
  }, { rootMargin: '-100px 0px -60% 0px', threshold: 0.01 });

  sections.forEach(function (section) { DIXI_STATE.lessonObserver.observe(section); });
}

function weeklyChartHTML(weekly) {
  if (!weekly || !weekly.length) return '';
  var max = Math.max.apply(null, weekly.map(function (d) { return d.xp; }).concat([10]));
  return weekly.map(function (d) {
    var h = d.xp > 0 ? Math.max(5, Math.round((d.xp / max) * 100)) : 2;
    return '<div class="chart-col ' + (d.isToday ? 'is-today' : '') + '">' +
      '<span class="chart-value">' + (d.xp > 0 ? d.xp : '') + '</span>' +
      '<div class="chart-bar-wrap"><div class="chart-bar ' + (d.isToday ? 'chart-bar--today' : '') + '" style="height:' + h + '%"></div></div>' +
      '<span class="chart-label">' + esc(d.label) + '</span>' +
    '</div>';
  }).join('');
}

    '</div>' +

      ? '<div class="rank-list" style="margin-top:10px;"><div class="rank-row is-me"><span class="rank-no">' + data.you.rank + '</span>' +
          avatarHTML(data.you.name) + '<span class="rank-name">' + esc(data.you.name) + ' · kamu</span>' +
          '<span class="rank-streak">' + icon('flame') + data.you.streak + '</span><span class="rank-xp">' + formatNumber(data.you.xp) + ' XP</span></div></div>'
      : '') +

    '<p class="access-note" style="margin-top:22px;">Peringkat dihitung dari total XP. Nama tampilan diambil dari profil akunmu.</p>' +
  '</div>';
}

function podiumCard(entry, place) {
  if (!entry) return '';
  return '<div class="podium-card podium-card--' + place + '">' +
    (place === 1 ? '<span class="podium-crown">' + icon('crown') + '</span>' : '') +
    '<span class="podium-rank">#' + place + '</span>' +
    avatarHTML(entry.name) +
    '<div class="podium-name">' + esc(entry.name) + (entry.isMe ? ' · kamu' : '') + '</div>' +
    '<div class="podium-xp">' + formatNumber(entry.xp) + ' XP</div>' +
    '<div class="podium-lvl">Level ' + entry.level + ' · ' + entry.streak + ' hari streak</div>' +
  '</div>';
}

function rankRowHTML(entry) {
  return '<div class="rank-row ' + (entry.isMe ? 'is-me' : '') + '">' +
    '<span class="rank-no">#' + entry.rank + '</span>' +
    avatarHTML(entry.name) +
    '<div style="flex:1;min-width:0;"><div class="rank-name">' + esc(entry.name) + (entry.isMe ? ' · kamu' : '') + '</div>' +
      '<div class="rank-meta">Level ' + entry.level + '</div></div>' +
    '<span class="rank-streak">' + icon('flame') + entry.streak + '</span>' +
    '<span class="rank-xp">' + formatNumber(entry.xp) + ' XP</span>' +
  '</div>';
}

/* =========================================================================
   VIEW ACTIONS
   ========================================================================= */

function handleViewAction(action, el, event) {
  if (action === 'landing-menu') {
    var menu = document.getElementById('landing-mobile-menu');
    if (menu) menu.classList.toggle('is-open');
    return true;
  }

  if (action === 'catalog-level') {
    DIXI_STATE.catalogFilter.level = el.getAttribute('data-level') || 'all';
    refreshCatalogGrid();
    return true;
  }

  if (action === 'catalog-reset') {
    DIXI_STATE.catalogFilter = { q: '', level: 'all' };
    var input = document.getElementById('catalog-search');
    if (input) input.value = '';
    refreshCatalogGrid();
    return true;
  }

  if (action === 'lesson-outline') {
    var target = el.getAttribute('data-target');
    document.querySelectorAll('.outline-link').forEach(function (link) { link.classList.remove('is-active'); });
    el.classList.add('is-active');
    scrollToId(target);
    return true;
  }

  if (action === 'open-flashcards') {
    openFlashcards(0);
    return true;
  }
  if (action === 'fc-flip') { flipFlashcard(); return true; }
  if (action === 'fc-next') { stepFlashcard(1); return true; }
  if (action === 'fc-prev') { stepFlashcard(-1); return true; }
  if (action === 'fc-shuffle') { shuffleFlashcards(); return true; }
  if (action === 'fc-known') { markFlashcard(true); return true; }
  if (action === 'fc-again') { markFlashcard(false); return true; }

  if (action === 'retry-lesson') {
    DIXI_STATE.lesson = null;
    DIXI_STATE.lessonKey = '';
    DIXI_STATE.lessonError = '';
    DIXI_STATE.lessonErrorCode = '';
    DIXI_STATE.lessonRequestKey = '';
    renderRoute();
    return true;
  }

  return false;
}
</script>

<script>
'use strict';

/* =========================================================================
   FLASHCARD KOSAKATA (fitur baru)
   ========================================================================= */

var DIXI_FC = null;

/**
 * Membuat kartu dari modul:
 *  - vocabulary: kata → arti
 *  - grammar   : nama rumus → rumus, dan kalimat Indonesia → kalimat Inggris
 */
function buildFlashcards(m) {
  if (!m) return [];
  if (m.vocab && m.vocab.length) {
    return m.vocab.map(function (v) {
      return {
        key: 'v:' + v.word, tag: v.pos, front: v.word, frontSub: v.phonetic, hint: 'Ketuk untuk melihat arti',
        back: v.meaning, quote: v.example, backSub: v.exampleId, extra: v.collocation, speak: v.word
      };
    });
  }
  var cards = [];
  (m.sections || []).forEach(function (section) {
    (section.formula || []).forEach(function (f) {
      cards.push({
        key: 'f:' + section.title + f.label, tag: 'Rumus', front: f.label, frontSub: section.title,
        hint: 'Ketuk untuk melihat rumusnya', back: f.value, mono: true, backSub: '', speak: ''
      });
    });
    var table = section.table;
    if (table && table.headers && table.rows) {
      var h = table.headers.map(function (x) { return String(x).toLowerCase(); });
      table.rows.forEach(function (row) {
        if (h.length === 3 && h[1] === 'aktif' && h[2] === 'pasif') {
          cards.push({ key: 't:' + row[1], tag: 'Ubah ke pasif', front: row[1], frontSub: row[0], hint: 'Ubah ke kalimat pasif, lalu ketuk kartu', back: row[2], backSub: section.title, speak: row[2] });
        } else if (h.length === 3 && h[2] === 'contoh') {
          cards.push({ key: 't:' + row.join('|'), tag: 'Pilih kata', front: row[0] + ' → ?', frontSub: h[0] === 'pronoun' ? 'Dipakai untuk apa?' : 'Pasangan yang tepat?',
            hint: 'Jawab dalam hati, lalu ketuk kartu', back: row[1], quote: row[2], backSub: section.title, speak: row[2] });
        } else if (h.length === 2 && h[0].indexOf('langsung') !== -1) {
          cards.push({ key: 't:' + row[0], tag: 'Ubah kalimat', front: row[0], frontSub: 'Jadikan kalimat tidak langsung', hint: 'Jawab dalam hati, lalu ketuk kartu', back: row[1], backSub: section.title, speak: '' });
        }
      });
    }
    (section.examples || []).forEach(function (ex) {
      var arrow = ex.en.indexOf(' → ');
      if (arrow !== -1) {
        cards.push({
          key: 'x:' + ex.en, tag: 'Ubah kalimat', front: ex.en.slice(0, arrow), frontSub: 'Ubah kalimat ini',
          hint: 'Jawab dalam hati, lalu ketuk kartu', back: ex.en.slice(arrow + 3), backSub: ex.id, speak: ex.en.slice(arrow + 3)
        });
        return;
      }
      var explanatory = /^(Benar|Salah|Defining|Non-defining)\b/.test(ex.id) || ex.id.indexOf('→') !== -1;
      if (explanatory) return;
      cards.push({
        key: 's:' + ex.en, tag: 'Terjemahkan', front: ex.id, frontSub: 'Bagaimana dalam bahasa Inggris?',
        hint: 'Jawab dalam hati, lalu ketuk kartu', back: ex.en, backSub: section.title, speak: ex.en
      });
    });
  });
  return cards;
}

function openFlashcards(start) {
  var lesson = DIXI_STATE.lesson && DIXI_STATE.lesson.module;
  var cards = buildFlashcards(lesson);
  if (!cards.length) return;
  DIXI_FC = { cards: cards, index: clamp(Number(start) || 0, 0, cards.length - 1), flipped: false, known: {}, title: lesson.title, track: lesson.track };
  openModal({
    cardClass: 'modal-card--fc track-' + lesson.track,
    raw: '<div class="fc-wrap" id="fc-wrap">' + flashcardInnerHTML() + '</div>',
    ariaLabel: 'Kartu latihan ' + lesson.title,
    onClose: function () { DIXI_FC = null; }
  });
}

function flashcardInnerHTML() {
  var fc = DIXI_FC;
  var card = fc.cards[fc.index];
  var knownCount = Object.keys(fc.known).filter(function (k) { return fc.known[k]; }).length;
  var pct = Math.round(((fc.index + 1) / fc.cards.length) * 100);
  var isSentence = card.tag !== 'Rumus' && card.tag !== '' && !(DIXI_FC.cards[0] && DIXI_FC.cards[0].key.indexOf('v:') === 0);
  return '<div class="fc-head">' +
      '<div><div class="fc-kicker">' + icon('layers') + ' Mode kartu · ' + esc(fc.title) + '</div>' +
      '<div class="fc-count">Kartu ' + (fc.index + 1) + ' dari ' + fc.cards.length + ' · <b>' + knownCount + '</b> sudah hafal</div></div>' +
      '<button class="modal-close" data-action="close-modal" aria-label="Tutup">' + icon('x') + '</button>' +
    '</div>' +
    '<div class="progress progress--thin progress--track" style="margin:0 20px;"><span class="progress-fill" style="width:' + pct + '%"></span></div>' +
    '<button type="button" class="fc-card ' + (fc.flipped ? 'is-flipped' : '') + '" data-action="fc-flip" aria-label="Balik kartu">' +
      '<span class="fc-face fc-front">' +
        '<span class="fc-pos">' + esc(card.tag) + '</span>' +
        '<span class="fc-word ' + (isSentence || card.front.length > 28 ? 'fc-word--long' : '') + '">' + esc(card.front) + '</span>' +
        (card.frontSub ? '<span class="fc-phonetic">' + esc(card.frontSub) + '</span>' : '') +
        '<span class="fc-hint">' + icon('rotate', 'icon-sm') + ' ' + esc(card.hint) + '</span>' +
      '</span>' +
      '<span class="fc-face fc-back">' +
        '<span class="fc-meaning ' + (card.mono ? 'fc-meaning--formula' : '') + (isSentence ? ' fc-meaning--sentence' : '') + '">' + esc(card.back) + '</span>' +
        (card.quote ? '<span class="fc-example">“' + esc(card.quote) + '”</span>' : '') +
        (card.backSub ? '<span class="fc-example-id">' + esc(card.backSub) + '</span>' : '') +
        (card.extra ? '<span class="fc-colloc">' + icon('sparkles', 'icon-sm') + ' ' + esc(card.extra) + '</span>' : '') +
      '</span>' +
    '</button>' +
    '<div class="fc-actions">' +
      '<button class="icon-btn" data-action="fc-prev" aria-label="Kartu sebelumnya"' + (fc.index === 0 ? ' disabled' : '') + '>' + icon('chevron-left') + '</button>' +
      (card.speak && (!isSentence || fc.flipped) ? '<button class="btn btn-ghost btn-sm" data-action="speak" data-word="' + esc(card.speak) + '">' + icon('volume') + ' Dengar</button>' : '') +
      (fc.flipped
        ? '<button class="btn btn-ghost btn-sm" data-action="fc-again">' + icon('rotate') + ' Ulang</button>' +
          '<button class="btn btn-primary btn-sm" data-action="fc-known">' + icon('check') + ' Hafal</button>'
        : '<button class="btn btn-primary btn-sm" data-action="fc-flip">' + icon('eye') + ' Balik kartu</button>') +
      '<button class="icon-btn" data-action="fc-next" aria-label="Kartu berikutnya"' + (fc.index >= fc.cards.length - 1 ? ' disabled' : '') + '>' + icon('chevron-right') + '</button>' +
    '</div>' +
    '<div class="fc-foot"><button class="link-btn" data-action="fc-shuffle">' + icon('rotate') + ' Acak urutan</button>' +
      '<span class="fc-keys">Spasi: balik · ← →: pindah</span></div>';
}

function renderFlashcard() {
  var wrap = document.getElementById('fc-wrap');
  if (wrap && DIXI_FC) wrap.innerHTML = flashcardInnerHTML();
}

function flipFlashcard() {
  if (!DIXI_FC) return;
  DIXI_FC.flipped = !DIXI_FC.flipped;
  renderFlashcard();
}

function stepFlashcard(delta) {
  if (!DIXI_FC) return;
  var next = clamp(DIXI_FC.index + delta, 0, DIXI_FC.cards.length - 1);
  if (next === DIXI_FC.index) return;
  DIXI_FC.index = next;
  DIXI_FC.flipped = false;
  renderFlashcard();
}

function markFlashcard(known) {
  if (!DIXI_FC) return;
  DIXI_FC.known[DIXI_FC.cards[DIXI_FC.index].key] = !!known;
  if (DIXI_FC.index < DIXI_FC.cards.length - 1) {
    stepFlashcard(1);
    return;
  }
  var total = DIXI_FC.cards.length;
  var knownCount = Object.keys(DIXI_FC.known).filter(function (k) { return DIXI_FC.known[k]; }).length;
  renderFlashcard();
  toast(knownCount === total ? 'Semua kartu hafal!' : 'Satu putaran selesai',
    knownCount + ' dari ' + total + ' kartu ditandai hafal.' + (knownCount < total ? ' Acak lalu ulangi yang belum.' : ''),
    knownCount === total ? 'success' : 'info');
  if (knownCount === total) launchConfetti({ count: 60 });
}

function shuffleFlashcards() {
  if (!DIXI_FC) return;
  var fc = DIXI_FC;
  var unknown = fc.cards.filter(function (c) { return !fc.known[c.key]; });
  var pool = unknown.length ? unknown : fc.cards.slice();
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  fc.cards = pool;
  fc.index = 0;
  fc.flipped = false;
  if (unknown.length) fc.known = {};
  renderFlashcard();
}

function handleFlashcardKeydown(event) {
  if (!DIXI_FC) return;
  var tag = (event.target && event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (event.key === 'ArrowRight') { event.preventDefault(); stepFlashcard(1); }
  else if (event.key === 'ArrowLeft') { event.preventDefault(); stepFlashcard(-1); }
  else if (event.key === ' ' || event.key === 'Spacebar') { event.preventDefault(); flipFlashcard(); }
}
</script>
