<script>
'use strict';

/* =========================================================================
   DIXIGRAM — Panel Admin
   File: AdminUI.html
   ========================================================================= */

var ADMIN_TABS = [
  { id: 'overview', label: 'Ringkasan', icon: 'dashboard' },
  { id: 'users', label: 'Pengguna', icon: 'users' },
  { id: 'survey', label: 'Angket', icon: 'clipboard' },
  { id: 'settings', label: 'Pengaturan', icon: 'settings' },
  { id: 'log', label: 'Log', icon: 'history' }
];

var ADMIN_STATUS = {
  pending: { label: 'Menunggu', icon: 'clock' },
  active: { label: 'Aktif', icon: 'circle-check' },
  suspended: { label: 'Nonaktif', icon: 'lock' },
  rejected: { label: 'Ditolak', icon: 'circle-x' }
};

var ADMIN_ACTIONS = {
  approve: { label: 'Setujui', icon: 'check', tone: 'primary' },
  reject: { label: 'Tolak', icon: 'x', tone: 'danger', confirm: 'Tolak pendaftaran {name}? Akun tidak bisa masuk sampai diaktifkan lagi.' },
  suspend: { label: 'Nonaktifkan', icon: 'lock', tone: 'danger', confirm: 'Nonaktifkan {name}? Ia langsung dikeluarkan dari semua perangkat.' },
  activate: { label: 'Aktifkan', icon: 'circle-check', tone: 'primary' },
  makeAdmin: { label: 'Jadikan admin', icon: 'shield', tone: 'ghost', confirm: 'Jadikan {name} admin? Admin bisa memvalidasi dan mengelola semua akun.' },
  removeAdmin: { label: 'Cabut admin', icon: 'shield', tone: 'ghost', confirm: 'Cabut hak admin {name}?' },
  resetPassword: { label: 'Reset password', icon: 'key', tone: 'ghost', confirm: 'Buat password sementara untuk {name}? Password lama tidak berlaku lagi.' },
  revokeSessions: { label: 'Keluarkan dari perangkat', icon: 'log-out', tone: 'ghost', confirm: 'Keluarkan {name} dari semua perangkat?' },
  resetProgress: { label: 'Reset progress', icon: 'rotate', tone: 'danger', confirm: 'Hapus seluruh XP, streak, dan riwayat belajar {name}? Tindakan ini tidak bisa dibatalkan.' },
  'delete': { label: 'Hapus akun', icon: 'trash', tone: 'danger', confirm: 'Hapus akun {name} beserta seluruh progress-nya secara permanen? Tindakan ini tidak bisa dibatalkan.' }
};

function adminState() {
  if (!DIXI_STATE.admin) {
    DIXI_STATE.admin = {
      overview: null,
      users: null,
      counts: null,
      filter: 'pending',
      q: '',
      loading: {},
      error: '',
      busy: '',
      overviewAt: 0,
      usersAt: 0,
      notif: []
    };
  }
  return DIXI_STATE.admin;
}

function adminTab() {
  var tab = DIXI_STATE.route && DIXI_STATE.route.params && DIXI_STATE.route.params.tab;
  return ADMIN_TABS.some(function (t) { return t.id === tab; }) ? tab : 'overview';
}

/* =========================================================================
   DATA
   ========================================================================= */

var ADMIN_FRESH_MS = 20000;

/**
 * Memuat data panel admin. Data yang lebih tua dari 20 detik (atau ditandai
 * basi karena ada pendaftar baru) selalu diambil ulang dari server —
 * sebelumnya data lama dipakai terus sehingga pendaftar baru tidak muncul.
 */
function ensureAdminLoaded(force) {
  var st = adminState();
  var tab = adminTab();
  var now = Date.now();
  var staleOverview = force || !st.overview || now - st.overviewAt > ADMIN_FRESH_MS;
  var staleUsers = force || !st.users || now - st.usersAt > ADMIN_FRESH_MS;
  if ((tab === 'overview' || tab === 'settings' || tab === 'log') && staleOverview) loadAdminOverview();
  if (tab === 'users' && staleUsers) loadAdminUsers();
  if (tab === 'survey') {
    if (!st.overview) loadAdminOverview();
    if (typeof loadAdminSurvey === 'function') loadAdminSurvey(force);
  }
}

function markAdminStale() {
  var st = adminState();
  st.overviewAt = 0;
  st.usersAt = 0;
  if (st.survey) st.survey.at = 0;
}

function rerenderAdmin() {
  if (DIXI_STATE.route.name !== 'admin' || DIXI_STATE.modal) {
    if (DIXI_STATE.route.name === 'admin' && DIXI_STATE.modal) {
      var view = document.querySelector('.view[data-page="admin"]');
      if (view) view.innerHTML = renderAdminPage();
    }
    return;
  }
  var y = window.scrollY;
  renderAppShell();
  updateThemeControls();
  updateFullscreenControls();
  window.scrollTo(0, y);
}

function syncPendingBadge(counts) {
  if (!counts) return;
  var st = adminState();
  st.counts = counts;
  if (DIXI_STATE.boot) {
    DIXI_STATE.boot.admin = Object.assign({}, DIXI_STATE.boot.admin || {}, { pending: counts.pending || 0 });
  }
  if (typeof updateAdminBadges === 'function') updateAdminBadges();
}

function loadAdminOverview() {
  var st = adminState();
  if (st.loading.overview) return;
  st.loading.overview = true;
  st.error = '';
  apiCall('apiAdminOverview', DIXI_STATE.token)
    .then(function (data) {
      st.overview = data;
      st.overviewAt = Date.now();
      syncPendingBadge(data.counts);
    })
    .catch(function (err) { st.error = err.message || 'Data admin tidak bisa dimuat.'; })
    .then(function () { st.loading.overview = false; rerenderAdmin(); });
}

function loadAdminUsers() {
  var st = adminState();
  if (st.loading.users) return;
  st.loading.users = true;
  st.error = '';
  apiCall('apiAdminListUsers', DIXI_STATE.token)
    .then(function (data) {
      st.users = data.users || [];
      st.usersAt = Date.now();
      syncPendingBadge(countFromUsers(st.users));
      if (st.filter === 'pending' && !st.users.some(function (u) { return u.status === 'pending'; })) st.filter = 'all';
    })
    .catch(function (err) { st.error = err.message || 'Daftar pengguna tidak bisa dimuat.'; })
    .then(function () { st.loading.users = false; rerenderAdmin(); });
}

function countFromUsers(users) {
  var c = { total: 0, pending: 0, active: 0, suspended: 0, rejected: 0, admin: 0 };
  (users || []).forEach(function (u) {
    c.total++;
    c[u.status] = (c[u.status] || 0) + 1;
    if (u.role === 'admin') c.admin++;
  });
  return c;
}

function findAdminUser(email) {
  var st = adminState();
  var pools = [(st.users || []), (st.overview && st.overview.pending) || []];
  for (var p = 0; p < pools.length; p++) {
    for (var i = 0; i < pools[p].length; i++) if (pools[p][i].email === email) return pools[p][i];
  }
  return null;
}

/* =========================================================================
   RENDER
   ========================================================================= */

function renderAdminPage() {
  var st = adminState();
  var tab = adminTab();
  var counts = st.counts || (st.overview && st.overview.counts) || { pending: adminPendingCount() };

  var tabs = '<div class="admin-tabs" role="tablist" aria-label="Bagian panel admin">' +
    ADMIN_TABS.map(function (t) {
      var on = t.id === tab;
      var badge = t.id === 'users' && counts.pending ? '<span class="nav-badge">' + counts.pending + '</span>' : '';
      return '<button class="admin-tab ' + (on ? 'is-active' : '') + '" role="tab" aria-selected="' + on + '" data-route="#/admin/' + t.id + '">' +
        icon(t.icon) + '<span>' + t.label + '</span>' + badge + '</button>';
    }).join('') +
  '</div>';

  var body;
  if (st.error && !st.overview && !st.users) {
    body = '<div class="error-page" style="margin:3vh auto;"><div class="error-icon">' + icon('info') + '</div>' +
      '<h1>Data belum bisa dimuat</h1><p>' + esc(st.error) + '</p>' +
      '<button class="btn btn-primary" data-action="admin-refresh">' + icon('rotate') + ' Coba lagi</button></div>';
  } else if (tab === 'users') {
    body = adminUsersTabHTML();
  } else if (tab === 'survey' && typeof adminSurveyTabHTML === 'function') {
    body = adminSurveyTabHTML();
  } else if (tab === 'settings') {
    body = adminSettingsTabHTML();
  } else if (tab === 'log') {
    body = adminLogTabHTML();
  } else {
    body = adminOverviewTabHTML();
  }

  return '<div class="admin-page">' +
    '<div class="page-head">' +
      '<div><div class="breadcrumb"><span>Admin</span>' + icon('chevron-right') + '<span>' + esc(ADMIN_TABS.filter(function (t) { return t.id === tab; })[0].label) + '</span></div>' +
        '<h1>Panel admin</h1><p>Validasi pendaftar, kelola akun, dan atur aplikasi.</p></div>' +
      '<div class="page-head-actions">' +
        (counts.pending ? '<span class="chip chip--warm">' + icon('clock') + ' ' + counts.pending + ' menunggu</span>' : '<span class="chip chip--success">' + icon('check') + ' Tidak ada antrean</span>') +
        '<button class="btn btn-ghost btn-sm" data-action="admin-refresh" aria-label="Muat ulang data">' + icon('rotate') + ' <span class="hide-xs">Muat ulang</span></button>' +
      '</div>' +
    '</div>' +
    tabs +
    '<div class="admin-body">' + body + '</div>' +
  '</div>';
}

function adminLoadingHTML(text) {
  return '<div class="loading-block"><span class="spinner"></span> ' + esc(text || 'Memuat data…') + '</div>';
}

function statusPillHTML(status) {
  var meta = ADMIN_STATUS[status] || ADMIN_STATUS.active;
  return '<span class="status-pill status-pill--' + esc(status) + '">' + icon(meta.icon) + meta.label + '</span>';
}

/* ---------- Ringkasan ---------- */

function adminOverviewTabHTML() {
  var st = adminState();
  var ov = st.overview;
  if (!ov) return adminLoadingHTML('Memuat ringkasan…');
  var c = ov.counts;

  var stats = '<div class="stat-grid admin-stats">' +
    '<button class="stat-card stat-card--accent stat-card--link" data-action="admin-goto-filter" data-filter="pending">' +
      '<div class="stat-card-head">' + icon('clock') + ' Menunggu validasi</div>' +
      '<div class="stat-card-value"><strong>' + formatNumber(c.pending) + '</strong><span>akun</span></div>' +
      '<div class="stat-card-foot">' + (c.pending ? 'Ketuk untuk meninjau' : 'Antrean kosong') + '</div></button>' +
    statCardHTML({ icon: 'users', label: 'Pengguna aktif', value: formatNumber(c.active), suffix: 'dari ' + formatNumber(c.total), foot: '<b>' + formatNumber(ov.online || 0) + '</b> online · <b>+' + ov.newThisWeek + '</b> pendaftar 7 hari' }) +
    statCardHTML({ icon: 'target', label: 'Latihan hari ini', value: formatNumber(ov.quizzesToday), foot: ov.activeToday + ' pembelajar aktif hari ini' }) +
    statCardHTML({ icon: 'chart', label: 'Akurasi 7 hari', value: ov.accuracyWeek + '%', foot: formatNumber(ov.quizzesWeek) + ' latihan dalam sepekan' }) +
  '</div>';

  var pending = '<section class="panel">' +
    '<div class="panel-head"><h2>Menunggu validasi</h2>' +
      (c.pending > 1 ? '<button class="btn btn-primary btn-sm admin-head-btn" data-action="admin-bulk-approve">' + icon('check') + ' Setujui semua (' + c.pending + ')</button>' : '') +
    '</div>' +
    '<div class="panel-sub">Pendaftar baru bisa masuk dan mencoba modul gratis, tetapi baru mendapat full access setelah disetujui.</div>' +
    '<div class="panel-body">' +
      (ov.pending.length
        ? '<div class="admin-user-list">' + ov.pending.map(function (u) { return adminUserCardHTML(u, true); }).join('') + '</div>' +
          (c.pending > ov.pending.length ? '<button class="link-btn" style="margin-top:12px;" data-action="admin-goto-filter" data-filter="pending">Lihat semua ' + c.pending + ' pendaftar ' + icon('arrow-right') + '</button>' : '')
        : emptyStateHTML('circle-check', 'Semua sudah divalidasi', 'Pendaftar baru akan muncul di sini.', '')) +
    '</div>' +
  '</section>';

  var max = Math.max.apply(null, ov.days.map(function (d) { return d.quizzes; }).concat([4]));
  var chart = '<section class="chart-panel">' +
    '<div class="chart-head"><div><h2>Aktivitas 7 hari</h2><p>Jumlah latihan selesai per hari.</p></div><span class="chip">' + formatNumber(ov.quizzesWeek) + ' latihan</span></div>' +
    '<div class="chart-bars">' + ov.days.map(function (d) {
      var h = d.quizzes > 0 ? Math.max(5, Math.round((d.quizzes / max) * 100)) : 2;
      return '<div class="chart-col ' + (d.isToday ? 'is-today' : '') + '" title="' + d.learners + ' pembelajar">' +
        '<span class="chart-value">' + (d.quizzes || '') + '</span>' +
        '<div class="chart-bar-wrap"><div class="chart-bar ' + (d.isToday ? 'chart-bar--today' : '') + '" style="height:' + h + '%"></div></div>' +
        '<span class="chart-label">' + esc(d.label) + '</span></div>';
    }).join('') + '</div>' +
  '</section>';

  var top = '<section class="chart-panel">' +
    '<div class="chart-head"><div><h2>Modul terpopuler</h2><p>7 hari terakhir.</p></div></div>' +
    (ov.topModules.length
      ? '<div class="recent-list">' + ov.topModules.map(function (m, i) {
          return '<div class="recent-row">' + trackIconHTML(m.track, m.icon) +
            '<div class="recent-main"><div class="recent-title">' + (i + 1) + '. ' + esc(m.title) + '</div>' +
            '<div class="recent-sub">' + (m.track === 'grammar' ? 'Grammar' : 'Vocabulary') + '</div></div>' +
            '<div class="recent-score">' + m.count + '×</div></div>';
        }).join('') + '</div>'
      : '<p class="muted" style="font-size:var(--fs-sm);">Belum ada latihan minggu ini.</p>') +
  '</section>';

  var links = '<section class="panel"><div class="panel-body admin-links">' +
    '<div><strong>Database</strong><span>Semua data tersimpan di Google Sheets. Buka untuk ekspor atau cadangan.</span></div>' +
    (ov.dbUrl ? '<a class="btn btn-ghost btn-sm" href="' + esc(ov.dbUrl) + '" target="_blank" rel="noopener">' + icon('arrow-up-right') + ' Buka spreadsheet</a>' : '') +
  '</div></section>';

  return stats + '<div class="admin-grid">' +
    '<div class="dash-col">' + pending + links + '</div>' +
    '<div class="dash-col">' + chart + top + '</div>' +
  '</div>';
}

/* ---------- Pengguna ---------- */

function adminFilteredUsers() {
  var st = adminState();
  var q = normalizeText(st.q);
  return (st.users || []).filter(function (u) {
    if (st.filter === 'admin' && u.role !== 'admin') return false;
    if (st.filter !== 'all' && st.filter !== 'admin' && u.status !== st.filter) return false;
    if (!q) return true;
    return normalizeText(u.name + ' ' + u.email).indexOf(q) !== -1;
  });
}

function adminUsersTabHTML() {
  var st = adminState();
  if (!st.users) return adminLoadingHTML('Memuat daftar pengguna…');
  var c = countFromUsers(st.users);
  var filters = [
    ['all', 'Semua', c.total], ['pending', 'Menunggu', c.pending], ['active', 'Aktif', c.active],
    ['suspended', 'Nonaktif', c.suspended], ['rejected', 'Ditolak', c.rejected], ['admin', 'Admin', c.admin]
  ];

  return '<div class="catalog-toolbar admin-toolbar">' +
      '<label class="catalog-search" for="admin-search">' + icon('search') +
        '<input id="admin-search" type="search" placeholder="Cari nama atau email…" value="' + esc(st.q) + '" autocomplete="off"></label>' +
      '<div class="filter-chips admin-filters">' + filters.map(function (f) {
        return '<button class="filter-chip ' + (st.filter === f[0] ? 'is-active' : '') + '" data-action="admin-filter" data-filter="' + f[0] + '">' +
          f[1] + ' <span class="chip-count">' + f[2] + '</span></button>';
      }).join('') + '</div>' +
    '</div>' +
    (st.filter === 'pending' && c.pending > 1
      ? '<div class="admin-bulk"><span>' + c.pending + ' akun menunggu validasi.</span><button class="btn btn-primary btn-sm" data-action="admin-bulk-approve">' + icon('check') + ' Setujui semua</button></div>'
      : '') +
    '<div class="admin-user-list" id="admin-user-list">' + adminUserListHTML() + '</div>';
}

function adminUserListHTML() {
  var list = adminFilteredUsers();
  if (!list.length) {
    return emptyStateHTML('users', 'Tidak ada akun', 'Coba kata kunci atau filter lain.', '');
  }
  return list.map(function (u) { return adminUserCardHTML(u, false); }).join('');
}

function adminUserCardHTML(u, compact) {
  var st = adminState();
  var me = DIXI_STATE.session && DIXI_STATE.session.user && DIXI_STATE.session.user.email === u.email;
  var busy = st.busy === u.email;
  var primary = [];
  if (u.status === 'pending') primary = ['approve', 'reject'];
  else if (u.status === 'active') primary = me ? [] : ['suspend'];
  else primary = ['activate'];

  var actions = primary.map(function (act) {
    var a = ADMIN_ACTIONS[act];
    var cls = a.tone === 'primary' ? 'btn-primary' : (a.tone === 'danger' ? 'btn-danger' : 'btn-ghost');
    return '<button class="btn btn-sm ' + cls + '" data-action="admin-user-action" data-act="' + act + '" data-email="' + esc(u.email) + '"' + (busy ? ' disabled' : '') + '>' +
      icon(a.icon) + ' ' + a.label + '</button>';
  }).join('') +
  '<button class="btn btn-sm btn-ghost" data-action="admin-manage" data-email="' + esc(u.email) + '"' + (busy ? ' disabled' : '') + ' aria-label="Kelola ' + esc(u.name) + '">' +
    icon('settings') + ' <span class="hide-xs">Kelola</span></button>';

  var meta = compact
    ? '<span>' + icon('calendar', 'icon-xs') + ' Daftar ' + esc(shortRelative(u.createdAt)) + '</span>'
    : '<span>Lv ' + u.level + ' · ' + formatNumber(u.xp) + ' XP</span>' +
      '<span>' + formatNumber(u.quizzes) + ' latihan · ' + u.completed + ' modul</span>' +
      '<span>Daftar ' + esc(formatDateId(u.createdAt) || '-') + '</span>' +
      (u.online ? '<span class="online-text">● Online sekarang</span>' : (u.lastActive ? '<span>Aktif ' + esc(shortRelative(u.lastActive)) + '</span>' : ''));

  return '<article class="admin-user ' + (busy ? 'is-busy' : '') + '">' +
    '<div class="admin-user-main">' +
      avatarHTML(u.name) +
      '<div class="admin-user-id">' +
        '<div class="admin-user-name">' + (u.online ? '<span class="online-dot" title="Sedang online"></span>' : '') +
          esc(u.name) + (me ? ' <span class="muted">(kamu)</span>' : '') + '</div>' +
        '<div class="admin-user-email">' + esc(u.email) + '</div>' +
      '</div>' +
      '<div class="admin-user-tags">' + statusPillHTML(u.status) +
        (u.role === 'admin' ? '<span class="status-pill status-pill--admin">' + icon('shield') + 'Admin</span>' : '') + '</div>' +
    '</div>' +
    '<div class="admin-user-meta">' + meta + '</div>' +
    '<div class="admin-user-actions">' + (busy ? '<span class="spinner"></span>' : '') + actions + '</div>' +
  '</article>';
}

/* ---------- Pengaturan ---------- */

function adminSwitchHTML(id, label, desc, on) {
  return '<label class="admin-switch-row" for="' + id + '">' +
    '<span class="settings-row-main"><strong>' + label + '</strong><span>' + desc + '</span></span>' +
    '<input type="checkbox" class="switch-input" id="' + id + '" name="' + id + '"' + (on ? ' checked' : '') + '>' +
    '<span class="switch" aria-hidden="true"></span>' +
  '</label>';
}

function adminSettingsTabHTML() {
  var st = adminState();
  if (!st.overview) return adminLoadingHTML('Memuat pengaturan…');
  var s = st.overview.settings;
  var tones = [['info', 'Info'], ['success', 'Kabar baik'], ['warning', 'Peringatan']];

  return '<form id="admin-settings-form" class="admin-settings" novalidate>' +
    '<section class="panel"><div class="panel-head"><h2>Pendaftaran</h2></div><div class="panel-body admin-switches">' +
      adminSwitchHTML('requireApproval', 'Wajib validasi admin', 'Pendaftar baru berstatus "menunggu" sampai disetujui. Matikan untuk langsung aktif.', s.requireApproval) +
      adminSwitchHTML('registrationOpen', 'Pendaftaran dibuka', 'Matikan untuk menutup pendaftaran akun baru sementara.', s.registrationOpen) +
      '<div class="admin-field-row"><div class="settings-row-main"><strong>Kuota latihan harian</strong><span>Untuk tamu dan akun yang belum divalidasi (0–20).</span></div>' +
        '<input class="input input--plain admin-number" type="number" id="guestLimit" name="guestLimit" min="0" max="20" step="1" inputmode="numeric" value="' + Number(s.guestLimit) + '"></div>' +
    '</div></section>' +

    '<section class="panel"><div class="panel-head"><h2>Pengumuman</h2></div>' +
      '<div class="panel-sub">Tampil sebagai banner di atas halaman untuk semua pengguna. Kosongkan untuk menyembunyikan.</div>' +
      '<div class="panel-body">' +
        '<textarea class="input input--plain admin-textarea" id="announcement" name="announcement" maxlength="280" rows="3" placeholder="Contoh: Modul baru minggu depan!">' + esc(s.announcement) + '</textarea>' +
        '<div class="admin-textarea-foot"><span id="announce-count">' + String(s.announcement || '').length + '/280</span></div>' +
        '<div class="segmented" role="radiogroup" aria-label="Warna pengumuman">' + tones.map(function (t) {
          var on = s.announcementTone === t[0];
          return '<label class="segmented-item ' + (on ? 'is-active' : '') + '"><input type="radio" name="announcementTone" value="' + t[0] + '"' + (on ? ' checked' : '') + ' class="sr-only">' + t[1] + '</label>';
        }).join('') + '</div>' +
      '</div></section>' +

    '<section class="panel"><div class="panel-head"><h2>Donasi</h2></div>' +
      '<div class="panel-sub">Tombol donasi sukarela dengan kode QRIS. Semua fitur tetap gratis, dengan atau tanpa donasi.</div>' +
      '<div class="panel-body admin-switches">' +
        adminSwitchHTML('donationEnabled', 'Tampilkan tombol donasi', 'Muncul di halaman depan, menu, dan dashboard.', s.donationEnabled) +
        '<div class="admin-field-col"><strong class="admin-field-label">Pesan di jendela donasi</strong>' +
          '<textarea class="input input--plain admin-textarea" id="donationMessage" name="donationMessage" maxlength="280" rows="3" placeholder="Kosongkan untuk memakai pesan bawaan.">' + esc(s.donationMessage || '') + '</textarea></div>' +
        '<div><button class="btn btn-ghost btn-sm" type="button" data-action="donate">' + icon('heart') + ' Lihat jendela donasi</button></div>' +
      '</div></section>' +

    '<section class="panel"><div class="panel-head"><h2>Alamat aplikasi</h2></div>' +
      '<div class="panel-sub">Alamat GitHub Pages yang dipakai untuk tautan di email notifikasi dan ikon tab. Kosongkan untuk memakai URL Apps Script.</div>' +
      '<div class="panel-body">' +
        '<input class="input input--plain" type="url" id="publicUrl" name="publicUrl" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="300" placeholder="https://namakamu.github.io/dixigram/" value="' + esc(st.overview.publicUrlInCode ? (st.overview.appUrl || '') : (s.publicUrl || '')) + '"' + (st.overview.publicUrlInCode ? ' disabled' : '') + '>' +
        '<p class="admin-hint">' + (st.overview.publicUrlInCode
          ? 'Terkunci: diatur lewat <code>PUBLIC_URL</code> di Code.gs. Ubah di sana bila alamatnya berganti.'
          : 'Tautan yang dipakai sekarang:' +
            (st.overview.appUrl ? ' <a href="' + esc(st.overview.appUrl) + '" target="_blank" rel="noopener">' + esc(st.overview.appUrl) + '</a>' : '')) + '</p>' +
      '</div></section>' +

    '<section class="panel"><div class="panel-head"><h2>Notifikasi email</h2></div>' +
      '<div class="panel-sub">Dikirim lewat akun Google pemilik script (kuota harian Gmail berlaku).</div>' +
      '<div class="panel-body admin-switches">' +
        adminSwitchHTML('notifyAdmins', 'Kabari admin saat ada pendaftar', 'Email ke semua admin setiap ada akun baru yang menunggu validasi.', s.notifyAdmins) +
        adminSwitchHTML('notifyUsers', 'Kabari pengguna saat disetujui', 'Email ke pengguna ketika akunnya divalidasi.', s.notifyUsers) +
      '</div></section>' +

    '<div class="form-error" id="admin-settings-error" role="alert"></div>' +
    '<div class="admin-save-bar"><button class="btn btn-primary" type="submit" id="admin-settings-save">' + icon('check') + ' Simpan pengaturan</button></div>' +
  '</form>';
}

/* ---------- Log ---------- */

var ADMIN_LOG_LABELS = {
  approve: 'menyetujui', reject: 'menolak', suspend: 'menonaktifkan', activate: 'mengaktifkan',
  makeAdmin: 'menjadikan admin', removeAdmin: 'mencabut admin', resetPassword: 'reset password',
  revokeSessions: 'mengeluarkan sesi', resetProgress: 'reset progress', 'delete': 'menghapus',
  'bulk-approve': 'menyetujui massal', settings: 'mengubah pengaturan'
};

function adminLogTabHTML() {
  var st = adminState();
  if (!st.overview) return adminLoadingHTML('Memuat log…');
  var log = st.overview.audit || [];
  if (!log.length) return emptyStateHTML('history', 'Belum ada aktivitas admin', 'Setiap tindakan admin akan tercatat di sini.', '');
  return '<section class="panel"><div class="panel-body"><ol class="admin-log">' + log.map(function (e) {
    return '<li><span class="admin-log-dot"></span><div>' +
      '<div class="admin-log-title"><strong>' + esc(e.admin) + '</strong> ' + esc(ADMIN_LOG_LABELS[e.action] || e.action) +
        (e.target && e.target !== '-' ? ' <span class="muted">' + esc(e.target) + '</span>' : '') + '</div>' +
      '<div class="admin-log-detail">' + esc(e.detail) + '</div>' +
      '<div class="admin-log-time">' + esc(formatDateId(e.at, { hour: '2-digit', minute: '2-digit' })) + '</div>' +
    '</div></li>';
  }).join('') + '</ol></div></section>';
}

/* =========================================================================
   AKSI
   ========================================================================= */

function handleAdminAction(action, el) {
  if (action.indexOf('admin-') !== 0) return false;
  var st = adminState();

  if (action === 'admin-refresh') {
    st.error = '';
    markAdminStale();
    ensureAdminLoaded(true);
    toast('Memuat ulang', 'Mengambil data terbaru dari database…', 'info', 1800);
    return true;
  }
  if (action === 'admin-filter') {
    st.filter = el.getAttribute('data-filter') || 'all';
    rerenderAdmin();
    return true;
  }
  if (action === 'admin-goto-filter') {
    st.filter = el.getAttribute('data-filter') || 'pending';
    markAdminStale();
    if (DIXI_STATE.modal) closeModal();
    navigateTo('#/admin/users');
    return true;
  }
  if (action === 'admin-notif') {
    closeUserMenu();
    openAdminNotifications();
    return true;
  }
  if (action === 'admin-notif-approve' || action === 'admin-notif-reject') {
    notifQuickAction(el.getAttribute('data-email'), action === 'admin-notif-approve' ? 'approve' : 'reject', el);
    return true;
  }
  if (action === 'admin-user-action') {
    requestAdminUserAction(el.getAttribute('data-email'), el.getAttribute('data-act'));
    return true;
  }
  if (action === 'admin-manage') {
    openAdminManage(el.getAttribute('data-email'));
    return true;
  }
  if (action === 'admin-bulk-approve') {
    var n = (st.counts && st.counts.pending) || 0;
    confirmDialog({
      title: 'Setujui semua pendaftar?',
      message: n + ' akun yang menunggu validasi akan langsung mendapat full access.',
      confirmLabel: 'Setujui semua',
      icon: 'check',
      onConfirm: runBulkApprove
    });
    return true;
  }
  if (action === 'admin-copy') {
    copyText(el.getAttribute('data-text') || '', el);
    return true;
  }
  return false;
}

function requestAdminUserAction(email, act) {
  var meta = ADMIN_ACTIONS[act];
  var user = findAdminUser(email);
  if (!meta || !user) return;
  if (DIXI_STATE.modal) closeModal();
  if (!meta.confirm) {
    setTimeout(function () { runAdminUserAction(email, act); }, DIXI_STATE.modal ? 60 : 0);
    return;
  }
  setTimeout(function () {
    confirmDialog({
      title: meta.label + '?',
      message: esc(meta.confirm.replace('{name}', user.name)) + '<br><span class="muted">' + esc(user.email) + '</span>',
      confirmLabel: meta.label,
      danger: meta.tone === 'danger',
      icon: meta.icon,
      onConfirm: function () { runAdminUserAction(email, act); }
    });
  }, 60);
}

function runAdminUserAction(email, act) {
  var st = adminState();
  st.busy = email;
  rerenderAdmin();
  apiCall('apiAdminUserAction', DIXI_STATE.token, email, act)
    .then(function (res) {
      st.users = res.users;
      syncPendingBadge(res.counts);
      if (st.overview) {
        st.overview.counts = res.counts;
        st.overview.pending = res.users.filter(function (u) { return u.status === 'pending'; }).slice(0, 8);
      }
      st.busy = '';
      if (st.filter === 'pending' && !res.users.some(function (u) { return u.status === 'pending'; })) st.filter = 'all';
      rerenderAdmin();
      if (res.tempPassword) {
        showTempPassword(findAdminUser(email) || { name: email, email: email }, res.tempPassword);
      } else {
        toast('Berhasil', res.message || 'Perubahan disimpan.', 'success');
      }
    })
    .catch(function (err) {
      st.busy = '';
      rerenderAdmin();
      toast('Tidak bisa diproses', err.message || 'Coba lagi.', 'error');
    });
}

function runBulkApprove() {
  var st = adminState();
  st.busy = '*';
  apiCall('apiAdminBulkApprove', DIXI_STATE.token, [])
    .then(function (res) {
      st.users = res.users;
      st.usersAt = Date.now();
      st.overviewAt = 0;
      st.notif = [];
      syncPendingBadge(res.counts);
      if (st.overview) { st.overview.counts = res.counts; st.overview.pending = []; }
      st.busy = '';
      if (st.filter === 'pending') st.filter = 'all';
      rerenderAdmin();
      toast('Berhasil', res.message, 'success');
      if (res.approved) launchConfetti({ count: 60 });
    })
    .catch(function (err) {
      st.busy = '';
      toast('Tidak bisa diproses', err.message || 'Coba lagi.', 'error');
    });
}

function openAdminManage(email) {
  var u = findAdminUser(email);
  if (!u) return;
  var me = DIXI_STATE.session && DIXI_STATE.session.user && DIXI_STATE.session.user.email === u.email;
  var acts = [];
  if (u.status === 'pending') acts.push('approve', 'reject');
  if (u.status === 'active' && !me) acts.push('suspend');
  if (u.online && !me) acts.push('revokeSessions');
  if (u.status === 'suspended' || u.status === 'rejected') acts.push('activate');
  acts.push(u.role === 'admin' ? 'removeAdmin' : 'makeAdmin');
  if (!me) acts.push('resetPassword');
  if (!me && !u.online) acts.push('revokeSessions');
  acts.push('resetProgress');
  if (!me) acts.push('delete');
  if (me) acts = acts.filter(function (a) { return a !== 'removeAdmin'; });

  var info = [
    ['Status', statusPillHTML(u.status) + (u.role === 'admin' ? ' <span class="status-pill status-pill--admin">' + icon('shield') + 'Admin</span>' : '')],
    ['Level & XP', 'Level ' + u.level + ' · ' + formatNumber(u.xp) + ' XP'],
    ['Latihan', formatNumber(u.quizzes || 0) + ' sesi · ' + (u.completed || 0) + ' modul tuntas'],
    ['Streak', formatNumber(u.streak || 0) + ' hari'],
    ['Bergabung', esc(formatDateId(u.createdAt, { hour: '2-digit', minute: '2-digit' }) || '-')],
    ['Login terakhir', esc(formatDateId(u.lastLogin, { hour: '2-digit', minute: '2-digit' }) || '-')],
    ['Sesi', u.role === 'admin' ? 'Admin (boleh multi-perangkat)' : (u.online ? '<span class="online-text">● Online sekarang</span>' : 'Tidak aktif')]
  ];

  openModal({
    title: u.name,
    subtitle: u.email,
    cardClass: 'modal-card--sm',
    body: '<dl class="admin-info">' + info.map(function (row) {
      return '<div><dt>' + row[0] + '</dt><dd>' + row[1] + '</dd></div>';
    }).join('') + '</dl>' +
    '<div class="admin-manage-actions">' + acts.map(function (act) {
      var a = ADMIN_ACTIONS[act];
      var cls = a.tone === 'primary' ? 'btn-primary' : (a.tone === 'danger' ? 'btn-danger' : 'btn-ghost');
      return '<button class="btn ' + cls + '" data-action="admin-user-action" data-act="' + act + '" data-email="' + esc(u.email) + '">' + icon(a.icon) + ' ' + a.label + '</button>';
    }).join('') + '</div>'
  });
}

function showTempPassword(user, password) {
  openModal({
    title: 'Password sementara',
    subtitle: 'Berikan ke ' + user.name + ' lewat jalur pribadi. Password ini hanya ditampilkan sekali.',
    cardClass: 'modal-card--sm',
    body: '<div class="temp-password"><code id="temp-password">' + esc(password) + '</code>' +
      '<button class="btn btn-ghost btn-sm" data-action="admin-copy" data-text="' + esc(password) + '">' + icon('check') + ' Salin</button></div>' +
      '<p class="muted" style="font-size:var(--fs-sm);margin-top:12px;">Sarankan ia segera mengganti password lewat Pengaturan → Ubah password.</p>',
    actions: '<button class="btn btn-primary" data-action="close-modal">Selesai</button>'
  });
}

function copyText(text, button) {
  function done() {
    if (button) button.innerHTML = icon('circle-check') + ' Tersalin';
    toast('Tersalin', 'Password sementara disalin ke clipboard.', 'success', 2400);
  }
  function fallback() {
    var code = document.getElementById('temp-password');
    if (code && window.getSelection) {
      var range = document.createRange();
      range.selectNodeContents(code);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { if (document.execCommand('copy')) { done(); return; } } catch (err) { /* abaikan */ }
    }
    toast('Salin manual', 'Teks sudah diblok — tekan lama lalu pilih Salin.', 'info');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

/* =========================================================================
   LONCENG NOTIFIKASI PENDAFTAR
   ========================================================================= */

function openAdminNotifications() {
  document.querySelectorAll('.toast [data-action="admin-notif"]').forEach(function (btn) {
    var t = btn.closest('.toast');
    if (t && t.parentNode) t.parentNode.removeChild(t);
  });
  openModal({
    title: 'Pendaftar baru',
    subtitle: 'Data diambil langsung dari database.',
    cardClass: 'modal-card--sm',
    body: '<div id="notif-body">' + adminLoadingHTML('Memuat pendaftar…') + '</div>',
    actions: '<button class="btn btn-ghost" data-action="close-modal">Tutup</button>' +
      '<button class="btn btn-primary" data-action="admin-goto-filter" data-filter="pending">' + icon('users') + ' Buka panel admin</button>'
  });
  loadNotifications();
}

function loadNotifications() {
  apiCall('apiAdminPending', DIXI_STATE.token)
    .then(function (res) {
      adminState().notif = res.pending || [];
      if (res.pulse) applyAdminPulse(res.pulse, false);
      markAdminStale();
      renderNotifications();
    })
    .catch(function (err) {
      var box = document.getElementById('notif-body');
      if (box) {
        box.innerHTML = '<div class="notif-empty">' + icon('wifi-off') + '<strong>Gagal memuat</strong><span>' + esc(err.message || 'Coba lagi.') + '</span>' +
          '<button class="btn btn-ghost btn-sm" data-action="admin-notif">' + icon('rotate') + ' Coba lagi</button></div>';
      }
    });
}

function renderNotifications() {
  var box = document.getElementById('notif-body');
  if (!box) return;
  var list = adminState().notif || [];
  if (!list.length) {
    box.innerHTML = '<div class="notif-empty">' + icon('circle-check') + '<strong>Tidak ada pendaftar yang menunggu</strong>' +
      '<span>Pendaftar baru akan muncul di sini dan di lencana lonceng.</span></div>';
    return;
  }
  box.innerHTML = '<div class="notif-list">' + list.map(function (u) {
    return '<div class="notif-item" data-notif="' + esc(u.email) + '">' +
      avatarHTML(u.name) +
      '<div class="notif-main"><strong>' + esc(u.name) + '</strong><span>' + esc(u.email) + '</span>' +
        '<em>Daftar ' + esc(shortRelative(u.createdAt)) + '</em></div>' +
      '<div class="notif-actions">' +
        '<button class="btn btn-primary btn-sm" data-action="admin-notif-approve" data-email="' + esc(u.email) + '">' + icon('check') + ' Setujui</button>' +
        '<button class="btn btn-ghost btn-sm" data-action="admin-notif-reject" data-email="' + esc(u.email) + '" aria-label="Tolak ' + esc(u.name) + '">' + icon('x') + '</button>' +
      '</div></div>';
  }).join('') + '</div>' +
  (list.length > 1 ? '<button class="btn btn-ghost btn-block" style="margin-top:12px;" data-action="admin-bulk-approve">' + icon('check') + ' Setujui semua (' + list.length + ')</button>' : '');
}

function notifQuickAction(email, act, button) {
  var row = button && button.closest('.notif-item');
  if (row) {
    row.classList.add('is-busy');
    row.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  }
  apiCall('apiAdminUserAction', DIXI_STATE.token, email, act)
    .then(function (res) {
      var st = adminState();
      st.users = res.users;
      st.usersAt = Date.now();
      st.overviewAt = 0;
      syncPendingBadge(res.counts);
      st.notif = (st.notif || []).filter(function (u) { return u.email !== email; });
      renderNotifications();
      toast(act === 'approve' ? 'Disetujui' : 'Ditolak', res.message || '', act === 'approve' ? 'success' : 'info', 3500);
      if (DIXI_STATE.route.name === 'admin') {
        var view = document.querySelector('.view[data-page="admin"]');
        if (view) view.innerHTML = renderAdminPage();
      }
    })
    .catch(function (err) {
      if (row) {
        row.classList.remove('is-busy');
        row.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
      }
      toast('Tidak bisa diproses', err.message || 'Coba lagi.', 'error');
    });
}

function handleAdminSubmit(form, event) {
  if (form.id !== 'admin-settings-form') return false;
  event.preventDefault();
  var st = adminState();
  var box = document.getElementById('admin-settings-error');
  var button = document.getElementById('admin-settings-save');
  var limit = Number(form.querySelector('#guestLimit').value);
  if (box) box.classList.remove('is-visible');
  if (!isFinite(limit) || limit < 0 || limit > 20 || Math.round(limit) !== limit) {
    if (box) { box.innerHTML = icon('circle-x') + '<span>Kuota harian harus bilangan bulat 0–20.</span>'; box.classList.add('is-visible'); }
    return true;
  }
  var urlInput = form.querySelector('#publicUrl');
  var publicUrl = urlInput ? urlInput.value.trim() : '';
  if (publicUrl && !/^https:\/\/[^\s\/?#]+\.[^\s\/?#]+/i.test(publicUrl)) {
    if (box) { box.innerHTML = icon('circle-x') + '<span>Alamat aplikasi harus diawali https://, misalnya https://namakamu.github.io/dixigram/</span>'; box.classList.add('is-visible'); }
    if (urlInput) urlInput.focus();
    return true;
  }
  var toneInput = form.querySelector('input[name="announcementTone"]:checked');
  var patch = {
    requireApproval: form.querySelector('#requireApproval').checked,
    registrationOpen: form.querySelector('#registrationOpen').checked,
    guestLimit: limit,
    announcement: form.querySelector('#announcement').value,
    announcementTone: toneInput ? toneInput.value : 'info',
    notifyAdmins: form.querySelector('#notifyAdmins').checked,
    notifyUsers: form.querySelector('#notifyUsers').checked
  };
  if (urlInput && !urlInput.disabled) patch.publicUrl = publicUrl;
  var donOn = form.querySelector('#donationEnabled');
  var donMsg = form.querySelector('#donationMessage');
  if (donOn) patch.donationEnabled = donOn.checked;
  if (donMsg) patch.donationMessage = donMsg.value;
  setButtonLoading(button, true, 'Menyimpan…');
  apiCall('apiAdminSaveSettings', DIXI_STATE.token, patch)
    .then(function (res) {
      if (st.overview) {
        st.overview.settings = res.settings;
        if (res.appUrl) st.overview.appUrl = res.appUrl;
      }
      if (DIXI_STATE.boot) {
        DIXI_STATE.boot.settings = {
          requireApproval: res.settings.requireApproval,
          registrationOpen: res.settings.registrationOpen,
          announcement: res.settings.announcement,
          announcementTone: res.settings.announcementTone,
          guestLimit: res.settings.guestLimit,
          donationEnabled: res.settings.donationEnabled
        };
        DIXI_DONATION = null;
        if (DIXI_STATE.boot.config && DIXI_STATE.boot.config.guest) DIXI_STATE.boot.config.guest.quizLimit = res.settings.guestLimit;
      }
      try { localStorage.removeItem(DIXI_ANNOUNCE_KEY); } catch (err) { /* abaikan */ }
      rerenderAdmin();
      toast('Pengaturan disimpan', 'Perubahan langsung berlaku untuk semua pengguna.', 'success');
    })
    .catch(function (err) {
      setButtonLoading(button, false);
      if (box) { box.innerHTML = icon('circle-x') + '<span>' + esc(err.message || 'Gagal menyimpan.') + '</span>'; box.classList.add('is-visible'); }
    });
  return true;
}

function handleAdminInput(event) {
  var target = event.target;
  if (target.id === 'admin-search') {
    adminState().q = target.value;
    var box = document.getElementById('admin-user-list');
    if (box) box.innerHTML = adminUserListHTML();
    return;
  }
  if (target.id === 'announcement') {
    var counter = document.getElementById('announce-count');
    if (counter) counter.textContent = target.value.length + '/280';
    return;
  }
  if (target.name === 'announcementTone') {
    document.querySelectorAll('input[name="announcementTone"]').forEach(function (r) {
      r.parentNode.classList.toggle('is-active', r.checked);
    });
  }
}
