<script>
'use strict';

/* =========================================================================
   DIXIGRAM — Misi, Tantangan Mingguan & Cara Bermain (v1.5)
   File: Play.html
   ========================================================================= */

var DIXI_HOWTO_KEY = 'dixigram:howto-seen:v15';
var DIXI_CLAIMING = {};

/* -------------------------------------------------------------------------
   DATA
   ------------------------------------------------------------------------- */

function getMissions() {
  return (DIXI_STATE.boot && DIXI_STATE.boot.missions) || null;
}

function missionsClaimableCount() {
  var m = getMissions();
  return m && m.available ? (m.claimable || 0) : 0;
}

function formatCountdown(minutes) {
  var total = Math.max(0, Math.round(Number(minutes) || 0));
  var h = Math.floor(total / 60);
  var m = total % 60;
  if (h <= 0) return m + ' mnt';
  return h + ' j ' + (m < 10 ? '0' : '') + m + ' mnt';
}

/** Dipanggil applyQuizCompletion: catat misi yang baru selesai di latihan ini. */
function noteMissionChanges(next) {
  var prev = getMissions();
  var before = {};
  if (prev && prev.available) {
    prev.daily.missions.concat(prev.weekly.missions).forEach(function (m) {
      if (m.completed) before[m.period + ':' + m.id] = true;
    });
  }
  var fresh = [];
  if (next && next.available) {
    next.daily.missions.concat(next.weekly.missions).forEach(function (m) {
      if (m.completed && !before[m.period + ':' + m.id]) fresh.push(m);
    });
  }
  if (DIXI_STATE.boot) DIXI_STATE.boot.missions = next;
  DIXI_STATE.missionsJustCompleted = fresh;
  return fresh;
}

/* -------------------------------------------------------------------------
   KOMPONEN MISI
   ------------------------------------------------------------------------- */

function missionCardHTML(m, options) {
  var opts = options || {};
  var locked = !!opts.locked;
  var state = locked ? 'is-locked' : (m.claimed ? 'is-claimed' : (m.claimable ? 'is-claimable' : ''));
  var valueLabel = m.value + (m.unit || '') + ' / ' + m.target + (m.unit || '');
  var button;
  if (locked) {
    button = '<span class="mq-status">' + icon('lock') + ' Terkunci</span>';
  } else if (m.claimed) {
    button = '<span class="mq-status mq-status--done">' + icon('circle-check') + ' Diklaim</span>';
  } else if (m.claimable) {
    button = '<button class="btn btn-primary btn-sm mq-claim" data-action="mission-claim" data-id="' + esc(m.id) + '">' +
      icon('gift') + ' Klaim +' + m.xp + ' XP</button>';
  } else {
    button = opts.compact
      ? '<span class="mq-status">' + esc(valueLabel) + '</span>'
      : '<span class="mq-status">' + icon('target') + ' Kurang ' + esc(String(Math.max(0, m.target - m.value)) + (m.unit || '')) + '</span>';
  }
  return '<article class="mq-card mq-card--' + esc(m.period) + ' ' + state + (opts.compact ? ' mq-card--compact' : '') + '">' +
    '<span class="mq-icon">' + icon(m.claimed ? 'check' : m.icon) + '</span>' +
    '<div class="mq-main">' +
      '<div class="mq-top"><strong>' + esc(m.title) + '</strong><span class="mq-xp">' + icon('bolt') + '+' + m.xp + '</span></div>' +
      '<p>' + esc(m.description) + '</p>' +
      '<div class="mq-bar"><div class="progress progress--thin"><span class="progress-fill" style="width:' + (locked ? 0 : m.pct) + '%"></span></div>' +
        (opts.compact ? '' : '<span>' + esc(valueLabel) + '</span>') + '</div>' +
    '</div>' +
    '<div class="mq-action">' + button + '</div>' +
  '</article>';
}

function missionLockHTML(reason, inline) {
  var pending = reason === 'pending';
  return '<div class="mq-lock' + (inline ? ' mq-lock--inline' : '') + '">' +
    '<span class="mq-lock-icon">' + icon(pending ? 'clock' : 'lock') + '</span>' +
    '<div><strong>' + (pending ? 'Terbuka setelah akunmu divalidasi' : 'Khusus akun DIXIGRAM') + '</strong>' +
      '<span>' + (pending
        ? 'Begitu admin menyetujui akunmu, misi harian dan tantangan mingguan langsung aktif.'
        : 'Daftar gratis untuk mengerjakan misi, mengklaim XP bonus, dan masuk peringkat mingguan.') + '</span></div>' +
    (pending
      ? '<button class="btn btn-ghost btn-sm" data-action="check-status">' + icon('rotate') + ' Cek status</button>'
      : '<button class="btn btn-primary btn-sm" data-action="open-auth" data-mode="register">' + icon('sparkles') + ' Daftar gratis</button>') +
  '</div>';
}

/** Panel ringkas di dashboard. */
function missionsDashboardHTML() {
  var M = getMissions();

  var claimable = locked ? 0 : M.claimable;
  return '<section class="panel mq-panel">' +
    '<div class="panel-head"><h2>' + icon('target') + ' Misi hari ini</h2>' +
      (claimable ? '<span class="chip chip--success mq-pulse">' + icon('gift') + ' ' + claimable + ' siap diklaim</span>'
        : '<span class="chip">' + icon('clock') + ' ' + esc(formatCountdown(M.daily.minutesLeft)) + '</span>') +
    '</div>' +
    '<div class="panel-sub">' + (locked ? 'Pratinjau misi hari ini.' : M.daily.done + ' dari ' + M.daily.missions.length + ' misi diklaim · reset pukul 00.00 WIB.') + '</div>' +
    '<div class="panel-body">' +
      '<div class="mq-list">' + M.daily.missions.map(function (m) { return missionCardHTML(m, { compact: true, locked: locked }); }).join('') + '</div>' +
      (locked ? missionLockHTML(M.reason, true) : '') +
      '<button class="mq-weekly-strip" data-route="#/tantangan">' +
        '<span class="mq-weekly-icon">' + icon('swords') + '</span>' +
        '<span class="mq-weekly-copy"><strong>Tantangan mingguan</strong><span>' +
          (locked ? '3 tantangan · hadiah hingga ' + M.weekly.xpTotal + ' XP'
            : M.weekly.done + '/' + M.weekly.missions.length + ' selesai · sisa ' + M.weekly.daysLeft + ' hari') +
        '</span></span>' +
        '<span class="mq-weekly-dots">' + M.weekly.missions.map(function (m) {
          return '<i class="' + (m.claimed ? 'on' : (m.claimable ? 'ready' : '')) + '"></i>';
        }).join('') + '</span>' +
        icon('arrow-right') +
      '</button>' +
    '</div>' +
  '</section>';
}

/** Kotak misi di halaman hasil latihan. */
function missionResultHTML() {
  var M = getMissions();
  if (!M || !M.available) return '';
  var fresh = DIXI_STATE.missionsJustCompleted || [];
  var all = M.daily.missions.concat(M.weekly.missions);
  var ready = all.filter(function (m) { return m.claimable; });
  if (!fresh.length && !ready.length) {
    var nextUp = M.daily.missions.filter(function (m) { return !m.completed; })[0];
    if (!nextUp) return '';
    return '<div class="mq-result mq-result--hint">' + icon('target') +
      '<div><strong>Misi berikutnya: ' + esc(nextUp.title) + '</strong><span>' + esc(nextUp.description) + ' (' + nextUp.value + (nextUp.unit || '') + '/' + nextUp.target + (nextUp.unit || '') + ')</span></div>' +
      '<button class="btn btn-ghost btn-sm" data-route="#/tantangan">Lihat misi</button></div>';
  }
  return '<div class="mq-result">' +
    '<div class="mq-result-head">' + icon('gift') + '<strong>' + (fresh.length ? fresh.length + ' misi baru selesai!' : 'Hadiah misi menunggu') + '</strong>' +
      '<button class="link-btn" data-route="#/tantangan">Semua misi ' + icon('arrow-right') + '</button></div>' +
    '<div class="mq-list">' + ready.slice(0, 3).map(function (m) { return missionCardHTML(m, { compact: true }); }).join('') + '</div>' +
  '</div>';
}

function weeklyBoardHTML(board) {
  var b = board || { entries: [] };
  if (!b.entries.length) {
    return emptyStateHTML('swords', 'Belum ada skor minggu ini', 'Selesaikan satu latihan untuk membuka papan peringkat mingguan.');
  }
  var rows = b.entries.map(function (e) {
    return '<div class="wk-row' + (e.isMe ? ' is-me' : '') + '">' +
      '<span class="wk-rank wk-rank--' + (e.rank <= 3 ? e.rank : 'n') + '">' + (e.rank <= 3 ? icon(e.rank === 1 ? 'crown' : 'award') : e.rank) + '</span>' +
      avatarHTML(e.name) +
      '<div class="wk-name"><strong>' + esc(e.name) + (e.isMe ? ' <em>(kamu)</em>' : '') + '</strong><span>Level ' + e.level + ' · ' + e.quizzes + ' latihan</span></div>' +
      '<span class="wk-xp">' + formatNumber(e.xp) + '<small>XP</small></span>' +
    '</div>';
  }).join('');
  var you = b.you && !b.entries.some(function (e) { return e.isMe; })
    ? '<div class="wk-you">' + (b.you.pending ? 'Akunmu belum masuk peringkat (menunggu validasi).'
        : b.you.rank ? 'Posisimu: <strong>#' + b.you.rank + '</strong> · ' + formatNumber(b.you.xp) + ' XP minggu ini.'
        : 'Kamu belum punya XP minggu ini. Satu latihan sudah cukup untuk masuk papan.') + '</div>'
    : '';
  return '<div class="wk-board">' + rows + '</div>' + you;
}

        '<section class="panel">' +
          '<div class="panel-head"><h2>' + icon('trophy') + ' Peringkat minggu ini</h2></div>' +
          '<div class="panel-sub">XP latihan + XP misi sejak Senin. Papan dimulai dari nol setiap minggu.</div>' +

        '</section>' +
        '<section class="panel mq-rules">' +
          '<div class="panel-head"><h2>' + icon('info') + ' Aturan misi</h2></div>' +

            '<li>' + icon('gift') + '<span>Misi yang selesai harus <b>diklaim</b> sebelum periodenya berakhir agar XP masuk.</span></li>' +
            '<li>' + icon('bolt') + '<span>XP misi menambah total XP dan level, tetapi tidak dihitung ke target harian.</span></li>' +
            '<li>' + icon('award') + '<span>Klaim 10 misi harian dan 3 tantangan mingguan untuk membuka lencana khusus.</span></li>' +
          '</ul>' +
          '<button class="btn btn-ghost btn-sm" data-route="#/cara-bermain">' + icon('help') + ' Cara bermain lengkap</button></div>' +
        '</section>' +
      '</div>' +
    '</div>';
}

/* -------------------------------------------------------------------------
   KLAIM
   ------------------------------------------------------------------------- */

function claimMission(id, button) {
  if (!id || DIXI_CLAIMING[id]) return;
  DIXI_CLAIMING[id] = true;
  if (button) setButtonLoading(button, true, 'Mengklaim…');
  var before = {};
  getViewAchievements().forEach(function (a) { if (a.unlocked) before[a.id] = true; });

  apiCall('apiClaimMission', DIXI_STATE.token, id)
    .then(function (res) {
      delete DIXI_CLAIMING[id];
      if (DIXI_STATE.boot) {
        DIXI_STATE.boot.profile = res.profile;
        DIXI_STATE.boot.progress = res.progress;
        DIXI_STATE.boot.achievements = res.achievements;
        DIXI_STATE.boot.leaderboard = res.leaderboard;
        DIXI_STATE.boot.missions = res.missions;
        syncCatalogFromProgress(res.progress);
      }
      DIXI_STATE.missionsJustCompleted = (DIXI_STATE.missionsJustCompleted || []).filter(function (m) { return m.id !== id; });
      var y = window.scrollY;
      if (DIXI_STATE.route.name === 'quiz') { if (typeof renderQuizRoute === 'function') renderQuizRoute(); }
      else renderRoute();
      window.scrollTo(0, y);
      toast('+' + res.claimed.xp + ' XP', (res.claimed.period === 'weekly' ? 'Tantangan mingguan' : 'Misi') + ' “' + res.claimed.title + '” diklaim.', 'success', 3600);
      launchConfetti({ count: res.claimed.period === 'weekly' ? 110 : 60 });
      var fresh = res.achievements.filter(function (a) { return a.unlocked && !before[a.id]; });
      if (fresh.length) {
        setTimeout(function () {
          toast('Pencapaian baru', fresh.map(function (a) { return a.title; }).join(', '), 'success', 6500);
        }, 700);
      }
    })
    .catch(function (err) {
      delete DIXI_CLAIMING[id];
      if (button && document.body.contains(button)) setButtonLoading(button, false);
      toast('Klaim gagal', err.message || 'Coba lagi sebentar lagi.', 'error');
      if (err.code === 'NOT_FOUND' || err.code === 'ALREADY_CLAIMED') refreshBoot(true);
    });
}

      '<div class="hero-actions" style="margin-top:16px;">' +
        '<button class="btn btn-primary" data-route="#/grammar">' + icon('play') + ' Mulai latihan</button>' +
        '<button class="btn btn-ghost" data-route="#/tantangan">' + icon('target') + ' Lihat misi</button>' +
      '</div></div></section>';
}

/** Bagian ringkas di landing page (menggantikan "Cara main" lama). */
function howToLandingHTML() {
  return '<div class="ht-landing">' +
    howToStepsHTML() +
    '<div class="ht-landing-grid reveal">' +
      '<div class="ht-landing-card"><h3>' + icon('list-checks') + ' Aturan singkat</h3>' + howToRulesHTML() + '</div>' +
      '<div class="ht-landing-card"><h3>' + icon('bolt') + ' Hadiah XP</h3>' + howToXpTableHTML() + '</div>' +
    '</div>' +
    '<div class="hero-actions" style="justify-content:center;margin-top:18px;">' +
      '<button class="btn btn-ghost" data-route="#/cara-bermain">' + icon('help') + ' Panduan lengkap</button>' +
    '</div>' +
  '</div>';
}

/** Jendela panduan singkat: muncul sekali di tiap perangkat. */
function openHowToModal() {
  openModal({
    cardClass: 'modal-card--howto',
    title: 'Selamat datang di DIXIGRAM!',
    subtitle: 'Begini cara bermainnya — cukup 30 detik dibaca.',
    body: howToStepsHTML() +
      '<div class="ht-modal-rules">' +
        '<span>' + icon('layers') + ' ' + (getConfig().quizSize || 6) + ' soal acak</span>' +
        '<span>' + icon('flag') + ' Lulus ≥ ' + (getConfig().passScore || 60) + '%</span>' +
        '<span>' + icon('clock') + ' Tanpa batas waktu</span>' +
        '<span>' + icon('gift') + ' Klaim XP misi</span>' +
      '</div>',
    actions:
      '<button class="btn btn-ghost" data-action="howto-full">' + icon('help') + ' Panduan lengkap</button>' +
      '<button class="btn btn-primary" data-action="close-modal" autofocus>' + icon('play') + ' Ayo mulai</button>'
  });
}

function maybeShowHowTo() {
  var route = DIXI_STATE.route && DIXI_STATE.route.name;
  if (!route || ['landing', 'quiz', 'admin', 'angket', 'cara-bermain'].indexOf(route) !== -1) return;
  if (DIXI_STATE.modal || isAdmin()) return;
  var seen = '';
  try { seen = localStorage.getItem(DIXI_HOWTO_KEY) || ''; } catch (err) { seen = '1'; }
  if (seen) return;
  try { localStorage.setItem(DIXI_HOWTO_KEY, '1'); } catch (err) { /* abaikan */ }
  setTimeout(function () { if (!DIXI_STATE.modal) openHowToModal(); }, 450);
}

/* -------------------------------------------------------------------------
   AKSI
   ------------------------------------------------------------------------- */

function handlePlayAction(action, el) {
  if (action === 'mission-claim') { claimMission(el.getAttribute('data-id'), el); return true; }
  if (action === 'howto-open') { closeUserMenu(); openHowToModal(); return true; }
  if (action === 'howto-full') { closeModal(); navigateTo('#/cara-bermain'); return true; }
  return false;
}
</script>
