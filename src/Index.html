  <script>
    (function () {
      try {
        var saved = localStorage.getItem('dixigram:theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        var size = localStorage.getItem('dixigram:text-size');
        document.documentElement.setAttribute('data-text', size === 'lg' || size === 'xl' ? size : 'md');
        // v1.5: efek kaca. Otomatis "ringan" untuk perangkat bermemori kecil
        // atau bila pengguna meminta transparansi dikurangi.
        var glass = localStorage.getItem('dixigram:glass');
        if (glass !== 'full' && glass !== 'lite') {
          var lowMem = navigator.deviceMemory && navigator.deviceMemory <= 2;
          var lessGlass = window.matchMedia && window.matchMedia('(prefers-reduced-transparency: reduce)').matches;
          var noBlur = !(window.CSS && CSS.supports && (CSS.supports('backdrop-filter', 'blur(2px)') || CSS.supports('-webkit-backdrop-filter', 'blur(2px)')));
          glass = lowMem || lessGlass || noBlur ? 'lite' : 'full';
        }
        document.documentElement.setAttribute('data-glass', glass);
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-text', 'md');
      }
    })();
  </script>

</head>
