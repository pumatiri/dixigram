name: Deploy ke Google Apps Script

# Setiap perubahan di folder src/ pada branch main otomatis dikirim ke
# Apps Script dan deployment Web App diperbarui (URL /exec tetap sama).
on:
  push:
    branches: [main]
    paths: ['src/**']
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # ID deployment dari URL Web App. Bisa ditimpa lewat
      # Settings → Secrets and variables → Actions → Variables → GAS_DEPLOYMENT_ID
      DEPLOYMENT_ID: ${{ vars.GAS_DEPLOYMENT_ID || 'AKfycbziyKkuiVjUwUN0dMuUeSbLMtxTsNA4YyiCgajUzBe3WIyQjehz7l3_Ha9wRehdalkjAg' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Periksa secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secrets CLASPRC_JSON dan GAS_SCRIPT_ID belum diisi. Lihat README bagian 'Deploy otomatis'."
            exit 1
          fi

      - name: Pasang clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Tulis kredensial & konfigurasi
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$SCRIPT_ID" > .clasp.json

      - name: Kirim kode ke Apps Script
        run: clasp push --force

      - name: Perbarui deployment Web App
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)"

      - name: Bersihkan kredensial
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json
